[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ai-dev-radar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "feedparser>=6,<7"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "playwright>=1.48,<2"]
[tool.setuptools.package-data]
radar = ["static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
